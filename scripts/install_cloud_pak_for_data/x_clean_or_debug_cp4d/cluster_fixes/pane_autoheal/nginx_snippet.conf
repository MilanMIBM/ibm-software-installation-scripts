# cpd-pane-autoheal @@VERSION@@ (managed by x_toggle_pane_autoheal.sh)
# Included at server level of the ibm-nginx external server. No other extension
# or default config defines these three phase handlers at server level, so they
# are inherited by every location that does not define its own.

# Ask the upstream for uncompressed HTML on page / frame navigations only, so
# the body filter can see the markup (nginx re-gzips it towards the browser).
access_by_lua_block {
    local d = ngx.var.http_sec_fetch_dest
    if d == "document" or d == "iframe" or d == "frame" then
        ngx.req.clear_header("Accept-Encoding")
    end
}

header_filter_by_lua_block {
    if ngx.status ~= 200 then return end
    local d = ngx.var.http_sec_fetch_dest
    if d ~= "document" and d ~= "iframe" and d ~= "frame" then return end
    if ngx.header["Content-Encoding"] then return end
    local ct = ngx.header["Content-Type"]
    if type(ct) == "table" then ct = ct[1] end
    if not ct or not string.find(ct, "text/html", 1, true) then return end
    ngx.ctx.cpd_pane_autoheal = 0
    ngx.header["Content-Length"] = nil
    ngx.header["ETag"] = nil
}

body_filter_by_lua_block {
    local n = ngx.ctx.cpd_pane_autoheal
    if not n then return end
    local chunk = ngx.arg[1]
    if chunk and chunk ~= "" then
        local _, to = ngx.re.find(chunk, [[<head(?:\s[^>]*)?>]], "ijo")
        if to then
            ngx.arg[1] = string.sub(chunk, 1, to)
                .. '<script src="/cpd-pane-autoheal/autoheal.js?v=@@VERSION@@" defer></script>'
                .. string.sub(chunk, to + 1)
            ngx.ctx.cpd_pane_autoheal = nil
            return
        end
    end
    -- <head> is at the top of the document; stop looking after a few chunks
    if ngx.arg[2] or n >= 3 then ngx.ctx.cpd_pane_autoheal = nil else ngx.ctx.cpd_pane_autoheal = n + 1 end
}

# OpenResty caps an inline Lua block at ~4 KB, so the JS is split into chunks,
# one set_by_lua_block per chunk (only evaluated when this file is requested).
location = /cpd-pane-autoheal/autoheal.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
@@AUTOHEAL_JS_SETS@@
    content_by_lua_block {
        ngx.print(@@AUTOHEAL_JS_VARS@@)
    }
}

# Browser beacons (retry / recovered / gave_up / no_revert + JS stack) end up in
# the ibm-nginx container log, prefixed "[cpd-pane-autoheal]".
location = /cpd-pane-autoheal/report {
    error_log /dev/stderr warn;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    content_by_lua_block {
        ngx.req.read_body()
        local b = ngx.req.get_body_data() or ""
        b = string.gsub(string.sub(b, 1, 4000), "%c", " ")
        ngx.log(ngx.WARN, "[cpd-pane-autoheal] ", b)
        ngx.exit(204)
    }
}
