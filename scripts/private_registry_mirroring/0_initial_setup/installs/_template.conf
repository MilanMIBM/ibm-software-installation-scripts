# =============================================================================
# Install metadata for the private registry mirroring track - TEMPLATE
# -----------------------------------------------------------------------------
# To add a new product/install to the track, copy these files and replace
# "_template" with the install id (lowercase, letters/digits/underscore):
#
#   0_initial_setup/installs/<id>.conf      this file (metadata, KEY="value" lines only)
#   0_initial_setup/installs/<id>.sh.j2     its section of registry_mirror_vars.sh
#   0_initial_setup/installs/<id>.sh        verbs: components, prefill
#   1_map_content/installs/<id>.sh          verb: map            (required)
#   2_download_and_mirror/installs/<id>.sh  verbs: download, verify-registry (optional)
#   3_configure_cluster/installs/<id>.sh    verbs: cluster, tap, verify-cluster (optional)
#
# Core scripts never change: they loop over MIRROR_INSTALLS and run whichever
# hooks exist. Every _template.* file documents its contract.
# Values are read by awk, not sourced: keep them on one line, double-quoted.
# =============================================================================

# Id used in MIRROR_INSTALLS and in MIRROR_<ID>_* variable names (uppercased).
INSTALL_ID="_template"
INSTALL_LABEL="Template install (copy me)"

# ENV_TARGET of the install's own config (configs/*/<target>_vars.sh). Hooks run
# with it so they see the install's settings. Empty = the install has no config.
INSTALL_ENV_TARGET=""

# Variable holding the install's config dir (set by scripts/source_env_setup.sh);
# 3.5 writes registry_overrides.sh there.
INSTALL_CONFIG_DIR_VAR=""

# "true" when the install's *_vars.sh starts with an ENV_TARGET guard
# ([[ ENV_TARGET == <target> ]] || return 0); its registry_overrides.sh then
# carries the same guard, so "load every config" mode never mixes installs.
INSTALL_ENV_GUARD="true"

# Default registry path under the registry root (MIRROR_<ID>_REGISTRY_PATH overrides).
INSTALL_REGISTRY_PATH_DEFAULT="template"

# Content kinds MIRROR_<ID>_CONTENT may list.
INSTALL_CONTENT_KINDS="images charts files"

# The install's own image-source switch and the values for the track's
# private / local sources (empty = the install has no such switch).
INSTALL_IMAGE_SOURCE_VAR=""
INSTALL_IMAGE_SOURCE_PRIVATE="private"
INSTALL_IMAGE_SOURCE_LOCAL="local"
