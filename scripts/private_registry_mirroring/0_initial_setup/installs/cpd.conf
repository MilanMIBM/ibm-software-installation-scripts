# IBM Software Hub / Cloud Pak for Data (scripts/install_cloud_pak_for_data).
# IBM content goes through cpd-cli only (case-download, list-images, mirror-images,
# save-image/load-image, apply-icsp); the rest through the generic image/operator paths.
INSTALL_ID="cpd"
INSTALL_LABEL="IBM Software Hub / Cloud Pak for Data"
INSTALL_ENV_TARGET="cpd"
INSTALL_CONFIG_DIR_VAR="CONFIG_DIR"
INSTALL_ENV_GUARD="false"
INSTALL_REGISTRY_PATH_DEFAULT="cpd"
INSTALL_CONTENT_KINDS="case olm-utils ibm-images image-groups prereq-operators extra-images vllm oadp cli"
INSTALL_IMAGE_SOURCE_VAR="CPD_IMAGE_SOURCE"
INSTALL_IMAGE_SOURCE_PRIVATE="private"
INSTALL_IMAGE_SOURCE_LOCAL="local"
