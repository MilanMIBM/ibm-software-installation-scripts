# IBM Concert (scripts/install_ibm_concert). Its IBM images keep going through
# Concert's own 1.1_mirror_concert_images.sh (oc image mirror, cp/<suffix> layout);
# operators and data-store images go through the shared track, so Concert 1.2/1.3
# are skipped (CONCERT_MIRROR_VIA_SHARED=true, written by 3.5).
INSTALL_ID="concert"
INSTALL_LABEL="IBM Concert"
INSTALL_ENV_TARGET="concert"
INSTALL_CONFIG_DIR_VAR="CONCERT_CONFIG_DIR"
INSTALL_ENV_GUARD="true"
INSTALL_REGISTRY_PATH_DEFAULT="concert"
INSTALL_CONTENT_KINDS="ibm-images operators datastore-images runner-image"
INSTALL_IMAGE_SOURCE_VAR="CONCERT_IMAGE_SOURCE"
INSTALL_IMAGE_SOURCE_PRIVATE="mirrored"
INSTALL_IMAGE_SOURCE_LOCAL="airgap"
