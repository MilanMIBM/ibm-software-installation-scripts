# Cluster-wide content: operator catalogs (one union catalog per catalog source)
# and anything declared shared because several installs reuse it (U8).
# Install hooks emit shared items themselves (scope=shared); this "install" adds
# the extras listed in MIRROR_SHARED_OPERATORS / MIRROR_SHARED_IMAGES.
INSTALL_ID="shared"
INSTALL_LABEL="Shared (operator catalogs, reusable images)"
INSTALL_ENV_TARGET=""
INSTALL_CONFIG_DIR_VAR=""
INSTALL_ENV_GUARD="true"
INSTALL_REGISTRY_PATH_DEFAULT="shared"
INSTALL_CONTENT_KINDS="operators images"
INSTALL_IMAGE_SOURCE_VAR=""
INSTALL_IMAGE_SOURCE_PRIVATE="private"
INSTALL_IMAGE_SOURCE_LOCAL="local"
