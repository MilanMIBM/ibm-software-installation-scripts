# IBM Software Hub / Cloud Pak for Data (scripts/install_cloud_pak_for_data).
# Subplan: .claude/plans/in-cluster-install-runner-cp4d-subplan.md
INSTALL_ID="cpd"
INSTALL_LABEL="IBM Software Hub / Cloud Pak for Data"
INSTALL_ENV_TARGET="cpd"
RUNNER_INSTANCE_VAR="PROJECT_CPD_INST_OPERANDS"
RUNNER_ENTRYPOINTS="scripts/install_cloud_pak_for_data/0_x_full_quick_install_script/full_swhub_x_cpd_installprocess.sh scripts/install_cloud_pak_for_data/2_prepare_cluster/2.0-2.1_preliminary_setup/2.0_preliminary_setup.sh scripts/install_cloud_pak_for_data/2_prepare_cluster/2.2_install_prerequisite_operators/2.2_install_prerequisite_operators.sh scripts/install_cloud_pak_for_data/3_install_softwarehub/3.1_full_step_3_installprocess-softwarehub.sh scripts/install_cloud_pak_for_data/4_install_components/4.0_full_step_4_installprocess-cpd.sh scripts/install_cloud_pak_for_data/optional_install_swhub_control_center/full_installprocess-swhub_control_center.sh"
# Control Center reads its own vars file (it sources ../cpd_vars.sh), staged with configs/cp4d_config.
RUNNER_CHAIN_ENV_TARGETS="scripts/install_cloud_pak_for_data/optional_install_swhub_control_center/full_installprocess-swhub_control_center.sh=swhub_control_center"
RUNNER_STAGE_ROOTS="CONFIG_DIR:configs/cp4d_config SERVICE_INSTANCE_FILE_DIR:service_instances"
RUNNER_COLLECT_ROOTS="CONFIG_DIR:configs/cp4d_config SERVICE_INSTANCE_FILE_DIR:service_instances"
RUNNER_BASE_IMAGE_VAR="OLM_UTILS_IMAGE"
RUNNER_NEEDS_CPD_CLI="true"
RUNNER_STORAGE_CLASS_VAR="STG_CLASS_BLOCK"
RUNNER_PVC_SIZE="20Gi"
RUNNER_CPU_REQUEST="500m"
RUNNER_MEMORY_REQUEST="2Gi"
RUNNER_MEMORY_LIMIT="6Gi"
