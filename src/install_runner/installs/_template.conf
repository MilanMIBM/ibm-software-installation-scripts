# =============================================================================
# In-cluster install runner: install metadata - TEMPLATE
# -----------------------------------------------------------------------------
# To let a product run in cluster, copy these files and replace "_template" with
# the install id (lowercase, letters/digits/underscore):
#
#   src/install_runner/installs/<id>.conf   this file (KEY="value" lines only)
#   src/install_runner/installs/<id>.sh     hooks (optional, see _template.sh)
#
# Then add `ir_dispatch "$@"` after the env load of its chains, and
# INSTALL_RUN_MODE to its config template. Core code never names a product: it
# loops over these files. Values are read by awk, not sourced: keep them on one
# line, double-quoted, with no variable references.
# =============================================================================

# Id, and the ENV_TARGET of the install's own config.
INSTALL_ID="_template"
INSTALL_LABEL="Template install (copy me)"
INSTALL_ENV_TARGET=""

# Variable whose value makes the slot unique, so two instances of the product can
# run side by side. Empty = one slot per cluster, named after the install id.
RUNNER_INSTANCE_VAR=""

# Chains that may run in cluster, repo-relative, space-separated. Sub-chains count.
RUNNER_ENTRYPOINTS=""

# What the snapshot holds besides the repo's code: config and workspace paths,
# repo-relative. These are normally git-ignored, so they must be listed.
RUNNER_STAGE_PATHS=""

# What may come back from the pod at collect, repo-relative.
RUNNER_COLLECT_PATHS=""

# Variable holding the olm-utils image the runner image builds on.
RUNNER_BASE_IMAGE_VAR=""

# "true" when the chains use cpd-cli verbs other than `manage`.
RUNNER_NEEDS_CPD_CLI="false"

# Variable naming the default storage class for the runner's volume.
RUNNER_STORAGE_CLASS_VAR=""

# Sizing defaults; INSTALL_RUNNER_PVC_SIZE overrides the volume.
RUNNER_PVC_SIZE="20Gi"
RUNNER_CPU_REQUEST="250m"
RUNNER_MEMORY_REQUEST="1Gi"
RUNNER_MEMORY_LIMIT="4Gi"
