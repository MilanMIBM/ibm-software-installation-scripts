# =============================================================================
# In-cluster install runner: the smoke test module (test only, no product)
# -----------------------------------------------------------------------------
# A harmless chain that walks the whole runner path on a real cluster: hand-off,
# staging, the supervisor, the step journal, a warning step, attach and collect.
# It is no install: the runner finds it only with IR_MODULE_DIRS set to this
# folder (see README.md here), so it is never listed or offered to users.
# =============================================================================
INSTALL_ID="smoke"
INSTALL_LABEL="Runner smoke test (test only, no product)"
INSTALL_ENV_TARGET="smoke"
RUNNER_INSTANCE_VAR=""
RUNNER_ENTRYPOINTS="tests/install_runner_smoke/full_smoke_chain.sh"
RUNNER_CHAIN_ENV_TARGETS=""
# SMOKE_CONFIG_DIR is set by smoke_vars.sh: the folder it was loaded from.
RUNNER_STAGE_ROOTS="SMOKE_CONFIG_DIR:configs/smoke_config"
RUNNER_COLLECT_ROOTS="SMOKE_CONFIG_DIR:configs/smoke_config SERVICE_INSTANCE_FILE_DIR:service_instances"
RUNNER_BASE_IMAGE_VAR="OLM_UTILS_IMAGE"
RUNNER_NEEDS_CPD_CLI="false"
RUNNER_STORAGE_CLASS_VAR="STG_CLASS_BLOCK"
RUNNER_PVC_SIZE="2Gi"
RUNNER_CPU_REQUEST="100m"
RUNNER_MEMORY_REQUEST="512Mi"
RUNNER_MEMORY_LIMIT="2Gi"
