apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  replicas: 1
  image:
    application: docker.io/cnfldemos/cp-server-connect-datagen:0.6.7-8.0.0
    init: docker.io/confluentinc/confluent-init-container:3.4.0
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi
  injectLabels:
    app.kubernetes.io/part-of: confluent
  groupID: compose-connect-group
  internalTopicReplicationFactor: 3
  keyConverterType: org.apache.kafka.connect.storage.StringConverter
  valueConverterType: io.confluent.connect.avro.AvroConverter
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    producer:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    consumer:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    admin:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schema-registry.confluent.svc.cluster.local:8081
