apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: control-center
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  to:
    kind: Service
    name: control-center
  port:
    targetPort: external
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
