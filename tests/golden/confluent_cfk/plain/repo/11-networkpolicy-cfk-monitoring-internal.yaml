apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cfk-monitoring-internal
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  podSelector:
    matchLabels:
      app: control-center
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          confluent-platform: 'true'
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9093
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ''
    ports:
    - protocol: TCP
      port: 9021
