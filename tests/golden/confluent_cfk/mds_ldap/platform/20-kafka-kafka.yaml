apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  replicas: 3
  image:
    application: docker.io/confluentinc/cp-server:8.4.0
    init: docker.io/confluentinc/confluent-init-container:3.4.0
  dataVolumeCapacity: 100Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi
  injectLabels:
    app.kubernetes.io/part-of: confluent
  license:
    secretRef: confluent-license
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: confluent-sasl-cfk-server
    replication:
      authentication:
        type: plain
        jaasConfig:
          secretRef: confluent-sasl-cfk-server
    external:
      authentication:
        type: plain
        jaasConfig:
          secretRef: confluent-sasl-cfk-server
  authorization:
    type: rbac
    superUsers:
    - User:confluent-admin
    - User:mds-admin
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
    metricsClient:
      url: http://control-center.confluent.svc.cluster.local:9090
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: confluent-mds-cfk-client
  services:
    mds:
      tokenKeyPair:
        secretRef: confluent-mds-cfk-token
      provider:
        ldap:
          address: ldap://openldap.confluent.svc.cluster.local:1389
          authentication:
            type: simple
            simple:
              secretRef: confluent-ldap-cfk-bind
          configurations:
            userSearchBase: ou=users,dc=confluent,dc=io
            userNameAttribute: cn
            userObjectClass: inetOrgPerson
            groupSearchBase: ou=groups,dc=confluent,dc=io
            groupNameAttribute: cn
            groupObjectClass: groupOfNames
            groupMemberAttribute: member
            groupMemberAttributePattern: cn=(.*),ou=users,dc=confluent,dc=io
  configOverrides:
    server:
    - default.replication.factor=3
    - min.insync.replicas=2
    - num.partitions=3
    - offsets.topic.replication.factor=3
    - transaction.state.log.replication.factor=3
    - transaction.state.log.min.isr=2
    - transaction.max.timeout.ms=3600000
    - group.initial.rebalance.delay.ms=0
    - confluent.license.topic.replication.factor=3
    - confluent.balancer.topic.replication.factor=3
    - confluent.metadata.topic.replication.factor=3
    - confluent.consumer.lag.emitter.enabled=true
    - confluent.schema.registry.url=http://schema-registry.confluent.svc.cluster.local:8081
    - auto.create.topics.enable=true
