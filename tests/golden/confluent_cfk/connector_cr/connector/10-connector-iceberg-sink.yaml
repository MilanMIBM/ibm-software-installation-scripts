apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: iceberg-sink
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  class: io.tabular.iceberg.connect.IcebergSinkConnector
  taskMax: 1
  configs:
    topics: orders
    iceberg.tables: demo.orders
    iceberg.catalog.type: rest
    iceberg.catalog.s3.access-key-id: ${file:/mnt/secrets/iceberg-watsonx-credentials/credentials.properties:iceberg.catalog.s3.access-key-id}
    iceberg.catalog.s3.secret-access-key: ${file:/mnt/secrets/iceberg-watsonx-credentials/credentials.properties:iceberg.catalog.s3.secret-access-key}
  connectClusterRef:
    name: connect
