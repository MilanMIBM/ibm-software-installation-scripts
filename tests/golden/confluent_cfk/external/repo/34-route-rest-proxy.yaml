apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rest-proxy
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: confluent
    confluent.ibm-scripts/installed-by: local.confluent
    confluent.ibm-scripts/deploy-mode: operator
spec:
  host: rest-proxy-confluent.apps.example.com
  to:
    kind: Service
    name: rest-proxy
  port:
    targetPort: external
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
